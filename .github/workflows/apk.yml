name: APK

# Compila o APK do Xadrez Studio no runner do GitHub (o ambiente local de
# desenvolvimento não tem JDK/Android SDK). O APK e o log saem como artifacts.

on:
  workflow_dispatch:
  push:
    branches: ["main", "arena/**"]
    paths:
      - "android/**"
      - "app/public/**"
      - "app/package.json"
      - ".github/workflows/apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ambiente Android (usa o SDK já instalado no runner)
        run: |
          mkdir -p build
          {
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
            for d in "${ANDROID_HOME:-}" /usr/local/lib/android/sdk; do
              [ -n "$d" ] && [ -d "$d" ] && {
                echo "--- $d"
                echo "build-tools: $(ls "$d/build-tools" 2>/dev/null | tr '\n' ' ')"
                echo "platforms:   $(ls "$d/platforms" 2>/dev/null | tr '\n' ' ')"
                ls "$d/build-tools"/*/aapt2 2>/dev/null || true
              }
            done
          } | tee build/ambiente.log

      - name: Testes do app web
        working-directory: app
        run: |
          npm install --omit=dev
          npm install --no-save jsdom
          node tests/review.test.mjs
          node tests/armazenamento.test.mjs
          node tests/ui.smoke.mjs

      - name: Compilar APK
        run: |
          chmod +x android/build.sh
          ./android/build.sh 2>&1 | tee build/build.log

      - name: Conferir o APK
        run: |
          APK="dist/xadrez-studio-1.0.apk"
          { ls -la dist
            echo "--- conteúdo ---"
            unzip -l "$APK"
            echo "--- assinatura ---"
            "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" || true
          } 2>&1 | tee build/verificacao.log
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "assets/www/index.html"
          unzip -l "$APK" | grep -q "stockfish-19-lite-single.wasm"

      - name: Publicar APK + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xadrez-studio-apk
          path: |
            dist/*.apk
            dist/*.sha256
            build/*.log
          if-no-files-found: warn
          retention-days: 30
