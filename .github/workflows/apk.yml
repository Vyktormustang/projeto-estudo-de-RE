name: APK

# Compila o APK do Xadrez Studio no runner do GitHub (o ambiente de
# desenvolvimento não tem JDK/Android SDK).
#
# Saídas:
#   - Release "apk-v1.0" com o .apk + .sha256 (download permanente)
#   - artifact "xadrez-studio-apk" (30 dias)
#   - comentário na PR #5 com o resumo do build (ou o erro, se falhar)

on:
  workflow_dispatch:
  push:
    branches: ["main", "arena/**"]
    paths:
      - "android/**"
      - "app/public/**"
      - "app/package.json"
      - ".github/workflows/apk.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ambiente Android
        run: |
          mkdir -p build
          {
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            for d in "${ANDROID_HOME:-}" /usr/local/lib/android/sdk; do
              if [ -n "$d" ] && [ -d "$d" ]; then
                echo "--- $d"
                echo "build-tools: $(ls "$d/build-tools" 2>/dev/null | tr '\n' ' ')"
                echo "platforms:   $(ls "$d/platforms" 2>/dev/null | tr '\n' ' ')"
              fi
            done
          } 2>&1 | tee build/ambiente.log

      - name: Testes do app web
        working-directory: app
        run: |
          set -o pipefail
          {
            npm install --omit=dev
            npm install --no-save jsdom
            echo "=== review (motor real) ==="; node tests/review.test.mjs
            echo "=== armazenamento (APK) ==="; node tests/armazenamento.test.mjs
            echo "=== interface (jsdom) ==="; node tests/ui.smoke.mjs
          } 2>&1 | tee ../build/testes.log

      - name: Cache da chave de assinatura
        uses: actions/cache@v4
        with:
          path: android/keystore
          key: apk-keystore-v1
          # sem isso cada build geraria uma chave nova e o Android recusaria
          # instalar por cima da versão anterior

      - name: Compilar APK
        run: |
          set -o pipefail
          chmod +x android/build.sh
          ./android/build.sh 2>&1 | tee build/build.log

      - name: Conferir o APK
        run: |
          set -o pipefail
          APK="dist/xadrez-studio-1.0.apk"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "assets/www/index.html"
          unzip -l "$APK" | grep -q "stockfish-19-lite-single.wasm"
          echo "conteúdo essencial presente"

      - name: Publicar artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xadrez-studio-apk
          path: |
            dist/*.apk
            dist/*.sha256
            build/*.log
            build/apk-info.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar Release
        id: release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-v1.0"
          NOTES="$(cat build/apk-info.txt 2>/dev/null || echo 'build ok')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/xadrez-studio-1.0.apk dist/xadrez-studio-1.0.apk.sha256 --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" \
              dist/xadrez-studio-1.0.apk dist/xadrez-studio-1.0.apk.sha256 \
              --title "Xadrez Studio 1.0 — APK" \
              --notes "$NOTES"
          fi
          echo "url=$(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_OUTPUT"

      - name: Comentar na PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTADO: ${{ job.status }}
          URL_RELEASE: ${{ steps.release.outputs.url }}
        run: |
          {
            echo "### Build do APK: **${RESULTADO}**"
            echo
            if [ -f build/apk-info.txt ]; then
              echo '```'
              cat build/apk-info.txt
              echo '```'
            fi
            if [ -n "${URL_RELEASE:-}" ]; then
              echo
              echo "Download: ${URL_RELEASE}"
            fi
            if [ "${RESULTADO}" != "success" ]; then
              echo
              echo "<details><summary>Últimas linhas do log</summary>"
              echo
              echo '```'
              tail -60 build/build.log 2>/dev/null || tail -60 build/testes.log 2>/dev/null || echo "sem log"
              echo '```'
              echo "</details>"
            fi
          } > build/comentario.md
          gh pr comment 5 --repo "${{ github.repository }}" --body-file build/comentario.md \
            || gh issue create --repo "${{ github.repository }}" \
                 --title "Log do build do APK ($(date +%Y-%m-%dT%H:%M))" \
                 --body-file build/comentario.md \
            || true
